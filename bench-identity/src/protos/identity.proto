syntax = "proto3";

// A signer-key identity.
// If used to authenticate a user, it is either a chain key or a device key:
// - A chain key is the root identity for that user. It is used to sign
//   sensitive actions such as authenticated device additions/revocations and
//   username changes. The chain key is derived from a passphrase. The user can
//   rotate their chain key at any time.
// - A device key belongs to a specific device owned by the user. Messages are
//   encrypted for specific device keys. A device key can be revoked at any time,
//   at which point, peers should no longer send messages to that device.
message Identity {
  enum KeyType {
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_ED25519     = 1;
  }

  optional bytes   public_key      = 1;
  optional KeyType public_key_type = 2;
}

message RotateKeyAction {
  optional Identity new_chain_key = 1;
}

message DeviceAction {
  optional Identity device_key = 1;
}

message UsernameAction {
  optional string username = 1;
}

// A chain action is part of an action chain. It is verifiable by peers as
// each action specifies the signature of the previous action, and peers will
// cache the action chains for identities they've already encountered.
// We only use the action chain for sensitive actions where an audit log could
// be useful to peers.
// It is theoretically possible for two user-controlled devices to become
// desynchronized and publish equally valid but distinct chain action chains.
// In this case, peers will reject the identity update, and the user devices
// will reconcile the change: the version of the action change that has a lower
// timestamp or, if the timestamps are identical, a lower byte hash, will be
// used as the base and the other device will replay their actions on top of
// it.
// Note that this situation (where only the last chain action differs) will
// not flag a warning to peers; they will silently reject the identity change.
// But in cases more generally where the cached chain action chain is not the
// base for a new identity update, peers will render a UI notification. If the
// user with the chain mismatch is trusted, the notification will be large and
// explicit; if the user is untrusted (default), it will be a small warning
// symbol next to their messages.
message ChainAction {
  enum Action {
    CHAIN_ACTION_UNSPECIFIED     = 0;
    // When the chain key is rotated, the current chain key becomes
    // untrusted, and peers must use the new key provided by the rotation
    // action to verify all subsequent actions.
    // Chain key rotation happens during passphrase or hardware key change.
    CHAIN_ACTION_ROTATE_KEY      = 1;
    // A new device is added to the user's device list. Peers will use the
    // device key to send messages (one message sent per device).
    CHAIN_ACTION_ADD_DEVICE      = 2;
    // A current device key is revoked. Peers will no longer send messages to
    // this device key, and subsequent messages from this device will be
    // ignored.
    CHAIN_ACTION_REVOKE_DEVICE   = 3;
    // The username is changed. As this is a chain action, the username change
    // history is auditable.
    CHAIN_ACTION_CHANGE_USERNAME = 4;
  }
  optional uint32   counter         = 1;
  optional uint64   created_at      = 2;
  optional Identity device_origin   = 3;
  optional Action   action_type     = 4;
  optional bytes    prev_signature  = 5; // previous SignedChainAction signature
  oneof payload {
    RotateKeyAction rotate_key = 6;
    DeviceAction    device     = 7;
    UsernameAction  username   = 8;
  };
}

message SignedChainAction {
  optional bytes chain_action_bytes     = 1;
  optional bytes chain_action_signature = 2; // sign(chain_action_bytes, chain key)
}

// The user metadata is signed with the chain key, but it does not belong to a
// chain.
message UserMetadata {
  enum Version {
    VERSION_UNSPECIFIED = 0;
    VERSION_1           = 1;
  }
  optional Version version      = 1;
  //V1
  //peers must verify updated_at is newer than their cached metadata to
  //circumvent replay attacks
  optional uint64  updated_at   = 2;
  optional string  display_name = 3;
  optional bytes   avatar_hash  = 4;
}

message SignedUserMetadata {
  optional bytes metadata_bytes      = 1; // serialized UserMetadata
  optional bytes metadata_signature  = 2; // sign(metadata_bytes, chain key)
}

message UserIdentity {
  optional Identity           chain_key    = 1;
  repeated SignedChainAction  action_chain = 2; 
  optional SignedUserMetadata metadata     = 3;
}
